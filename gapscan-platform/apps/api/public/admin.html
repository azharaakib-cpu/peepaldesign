<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin · GapScan</title>
  <link rel="stylesheet" href="/app/styles.css">
</head>
<body>
<main>
  <header class="top">
    <div>
      <h1>Admin</h1>
      <p class="lead">Every design system extracted on this GapScan, with the full detail behind each one. People using GapScan don't see this area.</p>
    </div>
  </header>
  <div class="page-tabs" role="tablist" aria-label="Admin">
    <button role="tab" aria-selected="true" id="tab-systems">Design systems <span class="tab-count" id="count-systems"></span></button>
  </div>
  <section class="card" aria-labelledby="systems-title">
    <div class="card-head">
      <h2 id="systems-title">All design systems</h2>
      <label class="inline filter-label"><span class="visually-hidden">Search</span><input id="search" type="search" placeholder="Search by name or owner"></label>
    </div>
    <div class="table-wrap"><table id="systems" class="admin-table"></table></div>
    <p class="muted" id="systems-status" role="status">Loading…</p>
  </section>
</main>
<script src="/app/common.js"></script>
<script src="/app/admin.js"></script>
</body>
</html>
