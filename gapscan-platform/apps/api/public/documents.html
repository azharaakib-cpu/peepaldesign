<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Documents · GapScan</title>
  <link rel="stylesheet" href="/app/styles.css">
</head>
<body>
<main class="wide">
  <header class="top">
    <div>
      <h1>Documents</h1>
      <p class="lead" id="lead">The documents a complete design system has. GapScan has written what your sources show and started the rest; check each section and approve it.</p>
    </div>
    <a class="button" id="to-pdf" href="#">Make a PDF</a>
  </header>
  <section class="card docs-card" aria-labelledby="objects-title">
    <div class="card-head">
      <h2 id="objects-title" class="visually-hidden">Your documents</h2>
      <p class="muted docs-intro" id="docs-summary"></p>
      <div class="segmented" role="group" aria-label="Show">
        <button type="button" data-filter="all" aria-pressed="true">All sections</button>
        <button type="button" data-filter="review" aria-pressed="false">Needs approval <span class="tab-count" id="review-count"></span></button>
      </div>
    </div>
    <div id="reviewer-row" hidden><label for="reviewer">Your name, recorded with each approval</label><input id="reviewer" type="text" autocomplete="name" placeholder="Your name"></div>
    <div class="docs" id="objects"><p class="muted">Loading…</p></div>
  </section>
</main>
<script src="/app/common.js"></script>
<script src="/app/documents.js"></script>
<script src="/app/docs.js"></script>
</body>
</html>
